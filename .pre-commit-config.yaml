repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: ruff format --check
        language: system
        types: [python]
        pass_filenames: true
      - id: ruff-check
        name: ruff check
        entry: ruff check
        language: system
        types: [python]
        pass_filenames: true
      - id: mypy
        name: mypy
        entry: mypy afterquote/
        language: system
        types: [python]
        pass_filenames: false
